name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_FILE: docker/docker-compose.yml
  BASE_URL: http://localhost:4200
  API_URL: http://localhost:8091

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # The suite runs against its own instance of the application, so results
      # do not depend on the shared public demo or on its data.
      - name: Start the application
        run: docker compose up -d

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Wait for the database
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent 2>/dev/null; then
              echo "Database is ready"; exit 0
            fi
            sleep 2
          done
          echo "Database did not start"; exit 1

      - name: Create and seed the database
        run: docker compose exec -T laravel-api php artisan migrate:fresh --seed --force

      - name: Wait for the API and the UI
        run: |
          for url in "$API_URL/status" "$BASE_URL"; do
            echo "Waiting for $url"
            timeout 300 bash -c "until curl -sf -o /dev/null '$url'; do sleep 5; done"
          done

      - name: Run tests
        run: npx playwright test

      - name: Application logs
        if: failure()
        run: docker compose logs --tail=80

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload report for GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && hashFiles('playwright-report/index.html') != '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

  publish-report:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
